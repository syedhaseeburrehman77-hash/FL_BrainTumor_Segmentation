[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brain_tumor_fl"
version = "0.1.0"
description = "Brain Tumor 3D MRI Segmentation with Flower Federated Learning"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "flwr[simulation]==1.37.0",
    "torch>=2.1.0",
    "monai>=1.3.0",
    "nibabel>=5.2.0",
    "numpy>=1.26.0,<3.0.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["brain_tumor_fl"]

[tool.flwr.app]
publisher = "syedhaseeburrehman77-hash"

[tool.flwr.app.components]
serverapp = "server_app:app"
clientapp = "client_app:app"

[tool.flwr.app.config]
num-server-rounds = 5
local-epochs = 1
batch-size = 1
learning-rate = 0.00005
strategy = "fedavg"
proximal-mu = 0.01
fraction-train = 1.0
fraction-evaluate = 1.0
seed = 42
device = "auto"
num-workers = 0
cache-rate = 0.0
regsimagg-regularization-round = 10

data-root = "C:/Users/syedh/Documents/BraT_Segmentation_FeTs2022/MICCAI_FeTS2022_TrainingData"
partition-csv = "C:/Users/syedh/Documents/BraT_Segmentation_FeTs2022/MICCAI_FeTS2022_TrainingData/partitioning_1.csv"
output-dir = "artifacts"

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 23